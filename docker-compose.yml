services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      retries: 10

  api-1: &api
    build: .
    environment:
      NATS_URL: nats://nats:4222
      API_KEY: ${API_KEY:-}
    depends_on:
      nats: {condition: service_healthy}
    stop_grace_period: 30s
    restart: unless-stopped

  api-2: *api

  worker:
    build: .
    command: ["python", "-m", "deployment.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 30s
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats: {condition: service_healthy}
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api-1, api-2]

volumes:
  nats-data:
