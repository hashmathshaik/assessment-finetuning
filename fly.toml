app = "claim-detection"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  NATS_URL = "nats://claim-detection-nats.internal:4222"
  MAX_SENTENCES = "256"
  BATCH_MAX_WAIT_MS = "5"
  TORCH_THREADS = "2"
  # This is a public demo endpoint. Set a real API_KEY secret and remove this
  # to require auth: fly secrets set API_KEY=... --app claim-detection
  ALLOW_ANONYMOUS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 24
    hard_limit = 32

  [[http_service.checks]]
    grace_period = "45s"
    interval = "10s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
