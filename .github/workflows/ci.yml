name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          pip install pyflakes
          find finetuning deployment tests -name '*.py' -print0 | xargs -0 pyflakes

      - name: Compile
        run: python -m compileall -q finetuning deployment tests

      - name: Imports resolve
        run: |
          pip install -r requirements-serve.txt
          python -c "import deployment.app, deployment.worker, deployment.queue, deployment.batcher, deployment.model"

      - name: Validate compose
        run: docker compose config --quiet
