name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          pip install pyflakes
          pyflakes finetuning/*.py deployment/*.py tests/*.py

      - name: Compile
        run: python -m compileall -q finetuning deployment tests

      - name: Validate compose
        run: docker compose config --quiet
